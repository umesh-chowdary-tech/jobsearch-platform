# Render Blueprint for the hosted service and its web app (docs/hosted.md),
# on the free plan. New > Blueprint in the Render dashboard, pick your copy
# of this repo, then fill in the values it asks for.
#
# One person's MCP connector has its own blueprint, render-connector.yaml
# (docs/connector.md) - set "Blueprint Path" to it when you create one.
services:
  - type: web
    name: jobsearch-hosted
    runtime: python
    plan: free
    region: singapore            # nearest to Supabase's Mumbai region; keep the two close
    branch: main
    # Tectonic makes the resumes' PDFs; the script also fetches its TeX packages.
    buildCommand: pip install -e ".[hosted]" && bash scripts/install-tectonic.sh && cd web && npm ci && npm run build
    startCommand: python -m jobsearch.cli hosted --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: NODE_VERSION
        value: "22"
      - key: FORWARDED_ALLOW_IPS  # Render's proxy sets X-Forwarded-*
        value: "*"
      - key: SUPABASE_URL         # Project settings > API
        sync: false
      - key: SUPABASE_ANON_KEY    # public by design
        sync: false
      - key: DATABASE_URL         # the SESSION pooler's URL (port 5432), not the transaction one
        sync: false
      - key: JOBSEARCH_ADMINS     # your email
        sync: false
      - key: CRON_SECRET          # also a GitHub secret, for .github/workflows/cycle.yml
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JOBSEARCH_CONTACT    # how job boards can reach whoever runs this
        sync: false
      # Shown on the pages, and the blanks of the privacy notice and terms:
      # who runs this copy, their city, and where people write about their data.
      - key: JOBSEARCH_APP_NAME
        sync: false
      - key: JOBSEARCH_OPERATOR
        sync: false
      - key: JOBSEARCH_CITY
        sync: false
      - key: JOBSEARCH_PRIVACY_EMAIL
        sync: false
