# Render Blueprint, on the free plan. New > Blueprint in the Render dashboard,
# pick your copy of this repo, then fill in the values it asks for.
#
#   jobsearch-hosted     the hosted service and its web app (docs/hosted.md)
#   jobsearch-connector  one person's MCP connector (docs/connector.md)
#
# Delete the service you don't want from the blueprint before applying it.
#
# The connector's profile must reach the server without entering this public
# repository: point JOBSEARCH_PROFILES at where you put it (a private disk or
# repository), never commit a real person's profile here. The hosted service
# keeps everyone's profiles in var/, mirrored to its database.
services:
  - type: web
    name: jobsearch-hosted
    runtime: python
    plan: free
    region: singapore            # nearest to Supabase's Mumbai region; keep the two close
    branch: main
    buildCommand: pip install -e ".[hosted]" && cd web && npm ci && npm run build
    startCommand: python -m jobsearch.cli hosted --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: NODE_VERSION
        value: "22"
      - key: FORWARDED_ALLOW_IPS  # Render's proxy sets X-Forwarded-*
        value: "*"
      - key: SUPABASE_URL         # Project settings > API
        sync: false
      - key: SUPABASE_ANON_KEY    # public by design
        sync: false
      - key: DATABASE_URL         # the SESSION pooler's URL (port 5432), not the transaction one
        sync: false
      - key: JOBSEARCH_ADMINS     # your email
        sync: false
      - key: CRON_SECRET          # also a GitHub secret, for .github/workflows/cycle.yml
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JOBSEARCH_CONTACT    # how job boards can reach whoever runs this
        sync: false

  - type: web
    name: jobsearch-connector
    runtime: python
    plan: free
    region: singapore            # pick the region nearest your users; keep the database there too
    branch: main
    # -e on purpose: the code finds data/ and var/ relative to its own source
    # files, so it has to run from the checkout, not from site-packages.
    buildCommand: pip install -e ".[server]"
    startCommand: python -m jobsearch.cli connector
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL        # Neon's direct URL, not the -pooler one
        sync: false
      - key: CONNECTOR_SECRET    # a long random string; the URL is the password
        sync: false
      - key: JOBSEARCH_PROFILE   # the profile this connector serves
        sync: false
      - key: JOBSEARCH_PROFILES  # where that profile's folder is on the server
        sync: false
