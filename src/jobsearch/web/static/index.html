<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a2540'/%3E%3Cpath d='M7 9h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 17 18H7a1.5 1.5 0 0 1-1.5-1.5v-6A1.5 1.5 0 0 1 7 9zM10 9V7.5A1.5 1.5 0 0 1 11.5 6h1A1.5 1.5 0 0 1 14 7.5V9' stroke='%235DCAA5' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Sections">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
      <span>Job search</span>
    </div>
    <a href="#/" data-view="today"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span><span class="count" data-count="today"></span></a>
    <a href="#/postings" data-view="postings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h8M4 18h6M17 13a3 3 0 1 0 0 6a3 3 0 1 0 0-6zM19.2 18.2l2.3 2.3"/></svg><span>Postings</span></a>
    <a href="#/applications" data-view="applications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L10 14M21 3l-6.5 18-3.5-7-7-3.5z"/></svg><span>Applications</span></a>
    <a href="#/resumes" data-view="resumes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/></svg><span>Resumes</span></a>
    <a href="#/outreach" data-view="outreach"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/></svg><span>Outreach</span></a>
    <a href="#/market" data-view="market"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg><span>Market</span></a>
    <div class="sep" role="presentation"></div>
    <a href="#/profile" data-view="profile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
    <a href="#/setup" data-view="setup"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>Setup</span></a>
    <a href="#/system" data-view="system"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M5 10V4M12 20v-8M12 8V4M19 20v-4M19 12V4M3 14h4M10 8h4M17 16h4"/></svg><span>System</span></a>
  </nav>
  <div class="main">
    <header class="top">
      <span class="top-brand" aria-hidden="true"><span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span></span>
      <span id="health" class="health"><span id="health-dot" class="dot"></span><span id="health-text">Loading…</span></span>
      <div class="top-actions">
        <button id="stop-run" type="button" hidden>Stop</button>
        <select id="pause-for" aria-label="Pause the scheduled cycle">
          <option value="">Pause schedule…</option>
          <option value="1">for 1 hour</option>
          <option value="3">for 3 hours</option>
          <option value="8">for 8 hours</option>
          <option value="24">for a day</option>
          <option value="until">until I resume</option>
        </select>
        <button id="resume" type="button" hidden>Resume schedule</button>
        <button id="run-cycle" type="button" class="primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Run cycle</button>
        <button id="theme" type="button" class="icon-btn" aria-label="Switch to dark mode"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<section id="console" class="console" hidden aria-live="polite">
  <div class="console-head">
    <strong id="console-title"></strong>
    <span id="console-state"></span>
    <button id="console-close" type="button" aria-label="Hide output">Hide</button>
  </div>
  <pre id="console-lines"></pre>
</section>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
