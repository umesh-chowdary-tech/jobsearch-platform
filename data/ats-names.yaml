  Docker: {name: "Docker (Software)"}
  Jenkins: {name: "Jenkins"}
  Observability: {name: "Observability"}
  TypeScript: {name: "TypeScript"}
  Node.js: {name: "Node.js"}
  React: {name: "React.js"}
  React Native: {name: "React Native"}
  Express.js: {name: "Express.js"}
  FastAPI: {name: "FastAPI"}
  Java: {name: "Java (Programming Language)"}
  Spring Boot: {name: "Spring Boot"}
