  Next.js: ["next.js", nextjs]
  Vue: [vue, vuejs, "vue.js"]
  Angular: [angular, angularjs]
  Svelte: [svelte]
  Redux: [redux]
  Tailwind: [tailwind, tailwindcss]
  HTML: [html, html5]
  CSS: [css, css3, sass, scss]

backend:
