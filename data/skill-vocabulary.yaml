# skill-vocabulary.yaml — the detection dictionary.
#
# What triage looks for in a posting's text. Canonical name -> aliases.
#
# This is deliberately SEPARATE from skills.yaml. That file (in each profile)
# says what one person can claim; this one, shared, says what a posting might
# ask for. A term here that is absent
# from skills.yaml is a gap, which is the whole point of counting.
#
# Matching is whole-word and case-insensitive. Aliases exist because a posting
# saying "NodeJS" and a store saying "Node.js" mean the same thing, and counting
# them separately makes the gap ledger meaningless.
#
# Terms shorter than three characters are not listed: matching "R" or "Go" by
# word boundary produces far more noise than signal. Go is listed explicitly
# below with disambiguating aliases only.

languages:
  Python: [python, python3]
  TypeScript: [typescript, ts]
  JavaScript: [javascript, js, es6, ecmascript]
  Java: [java]
  Go: [golang, "go lang"]          # bare "go" is too noisy to match
  Rust: [rust]
  C++: ["c++", cpp]
  "C#": ["c#", csharp, "dotnet", ".net"]
  Ruby: [ruby]
  PHP: [php]
  Scala: [scala]
  Kotlin: [kotlin]
  Swift: [swift]
  SQL: [sql]
  Bash: [bash, shell scripting]

