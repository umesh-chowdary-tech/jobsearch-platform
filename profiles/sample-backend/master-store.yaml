# master-store.yaml - one defensible set of facts about one person's work.
#
# FICTIONAL SAMPLE. Kavya Example, her employer and her projects are made up;
# any resemblance to a real person or company is a coincidence. The tests run
# against this file, so it exercises every part of the schema.
#
# GOVERNING RULE: nothing in this file goes on a resume unless the person can
# defend it in an interview. The assembler SELECTS and REWORDS; it never inflates.
#
# Assembler rules (enforced, not advisory):
#   1. Never invent or round a number. If `metrics` is empty, describe WHAT changed,
#      not by how much.
#   2. `evidence: internal` = claimable but not linkable (employer work).
#   3. ATS keyword coverage comes from `tech`, never from `metrics`.
#   4. A skill appears on a resume only if some entry's `tech` backs it.
#   5. Entries with `status: parked` or `confidence: low` are never emitted without
#      a human decision first.

identity:
  name: Kavya Example
  location: Pune, India
  email: kavya.example@example.com
  phone: "+91 00000 00000"
  linkedin: ""
  github: ""
  title:
    official: Software Engineer II        # the title on the offer letter
    descriptor_flexes: true               # e.g. "Software Engineer II (Backend AI Engineer)"
    approved_descriptors:
      - Backend AI Engineer
      - Backend Software Engineer
      - AI Platform Engineer
    rule: >
      Always lead with the official title. The descriptor in parentheses is chosen
      per posting from the descriptors above; never coin a new one.
  # One row per employer. The resume's position line - title, employer, dates -
  # comes from here, never from whichever workstreams a variant happened to
  # select: rebuilt from the entries alone, a range loses its start month when
  # the oldest entry is cut for length, and a parser reads "2022" as January.
  employment:
    - employer: Acme Freight
      location: Pune, India
      start: 2022-04
      end: present
      title: Software Engineer II

  # Spoken languages, in the person's own order. No proficiency levels are
  # recorded - a form that asks gets the person's answer, not a guess.
  languages: [Marathi, Hindi, English]

