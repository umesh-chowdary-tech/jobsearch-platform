# Starts the hosted service's cycle on a timetable (docs/hosted.md): watch the
# boards once for everyone, then triage and rank for each person within their
# caps. Render's free plan has no cron and sleeps after 15 quiet minutes, so
# this wakes the service too. Needs two repository secrets: HOSTED_URL (e.g.
# https://jobsearch-hosted.onrender.com) and CRON_SECRET (the service's own).
# Without them, it does nothing.
name: cycle
on:
  schedule:
    - cron: "41 */2 * * *"      # every 2 hours, around the clock (00:41 UTC = 06:11 IST)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake the service and start a cycle
        env:
          HOSTED_URL: ${{ secrets.HOSTED_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HOSTED_URL" ] || [ -z "$CRON_SECRET" ]; then echo "HOSTED_URL or CRON_SECRET is not set - nothing to start"; exit 0; fi
          # Waking, or starting up after a deploy, the service can answer 502 for
          # a few minutes: three tries a minute apart once gave up too soon.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -X POST \
                   -H "X-Cron-Secret: $CRON_SECRET" "$HOSTED_URL/api/cron/cycle") || code=000
            echo "attempt $i: HTTP $code"
            # 202 started, 409 already running - both fine.
            if [ "$code" = 202 ] || [ "$code" = 409 ]; then exit 0; fi
            sleep 30
          done
          exit 1
